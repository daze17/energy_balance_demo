# Энержи Баланс — AI систем (EBRD AI for SME Consultants capstone demo)
# Бүх порт 47xxx мужид — бусад төслүүдтэй давхцахгүй.
name: energy-balance-ebrd

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: energybalance
      POSTGRES_USER: eb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eb_local_pass}
    ports:
      - "47432:5432"
    volumes:
      - eb_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eb -d energybalance"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "47025:1025"   # SMTP
      - "47825:8025"   # Inbox UI (Gmail-ийн орлуулагч)

  # Нэг удаа ажиллаад credential + workflow-уудыг n8n руу оруулна
  n8n-init:
    image: n8nio/n8n:2.48.4
    entrypoint: ["/bin/sh", "/bootstrap/init.sh"]
    environment: &n8n_env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: energybalance
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: eb
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-eb_local_pass}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-local-only-key}
      GENERIC_TIMEZONE: Asia/Ulaanbaatar
      TZ: Asia/Ulaanbaatar
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:47678}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:47678}/
      N8N_RUNNERS_ENABLED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      DB_PASSWORD: ${DB_PASSWORD:-eb_local_pass}
      MAIL_FROM: ${MAIL_FROM:-info@energybalance.local}
      STAFF_EMAIL: ${STAFF_EMAIL:-manager@energybalance.local}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_DISABLE_STARTTLS: ${SMTP_DISABLE_STARTTLS:-true}
    volumes:
      - eb_n8n:/home/node/.n8n
      - ./n8n:/bootstrap:ro
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.48.4
    restart: unless-stopped
    environment: *n8n_env
    ports:
      - "47678:5678"
    volumes:
      - eb_n8n:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${WEB_IMAGE:-energy-balance-web:local}
    restart: unless-stopped
    # Локал хөгжүүлэлт: код өөрчлөгдөхөд автоматаар дахин ачаална (серверт docker-compose.prod.yml үүнийг солино)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-http://localhost:47678}
      MAILBOX_URL: ${MAILBOX_URL:-http://localhost:47825}
      DATABASE_URL: postgresql://eb:${DB_PASSWORD:-eb_local_pass}@db:5432/energybalance
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@energybalance.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-EnergyBalance2026}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-*}
      TZ: Asia/Ulaanbaatar
    ports:
      - "47080:8000"
    volumes:
      - ./web/app:/app/app
      - ./brand:/app/brand:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  eb_db:
  eb_n8n:
