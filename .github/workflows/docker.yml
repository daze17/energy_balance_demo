# main руу push хийх бүрт вэб image-ийг бүтээж ghcr.io руу түлхэнэ (GitHub Container Registry — үнэгүй).
# Oracle-ийн үнэгүй VM ARM (arm64) тул хоёр архитектурт бүтээнэ.
name: docker

on:
  push:
    branches: [main]
    paths: ["web/**", "brand/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/energy-balance-web:latest
            ghcr.io/${{ steps.owner.outputs.name }}/energy-balance-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
